[project]
name = "cconf"
version = "1.1.0.dev0"
description = "Multi-sourced (and optionally encrypted) configuration management."
authors = [
    { name = "Dan Watson", email = "watsond@imsweb.com" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD" }
dependencies = [
    "cryptography",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]

[dependency-groups]
dev = [
    "django>=5.2.0,<7.0.0",
    "python-tss-sdk>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
secretserver = ["python-tss-sdk>=2.0.0,<3.0.0"]
all = ["python-tss-sdk>=2.0.0,<3.0.0"]

[project.urls]
Homepage = "https://github.com/imsweb/cconf"

[project.scripts]
cconf = "cconf.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["I"]
isort.known-first-party = ["cconf"]

[tool.pyright]
reportPrivateUsage = false
reportMissingModuleSource = false
